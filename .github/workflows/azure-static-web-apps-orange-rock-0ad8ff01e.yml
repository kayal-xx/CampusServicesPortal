name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'

      - name: Install dependencies
        working-directory: ./frontend/campus-services-portal
        run: npm install

      - name: Build Angular application
        working-directory: ./frontend/campus-services-portal
        run: npm run build

              - name: Verify Angular build output
        run: |
          echo "Checking Angular build output..."
          ls -la ./frontend/campus-services-portal/dist/campus-services-portal/browser
          test -f ./frontend/campus-services-portal/dist/campus-services-portal/browser/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_ROCK_0AD8FF01E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "./frontend/campus-services-portal/dist/campus-services-portal/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request

    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_ROCK_0AD8FF01E }}
          action: "close"