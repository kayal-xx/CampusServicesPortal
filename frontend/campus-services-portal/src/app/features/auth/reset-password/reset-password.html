<div class="reset-page">
  <div class="reset-card">

    <div class="reset-header">
      <div class="icon-circle">🔒</div>

      <h1>Reset Password</h1>

      <p>
        Enter your new password below.
      </p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="submit()">

      <div class="form-group">
        <label for="newPassword">New Password</label>

        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Enter new password"
          autocomplete="new-password"
        />

        <small
          class="error"
          *ngIf="
            resetForm.controls.newPassword.touched &&
            resetForm.controls.newPassword.invalid
          "
        >
          Password must be at least 6 characters.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>

        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm new password"
          autocomplete="new-password"
        />

        <small
          class="error"
          *ngIf="
            resetForm.controls.confirmPassword.touched &&
            resetForm.controls.confirmPassword.invalid
          "
        >
          Please confirm your password.
        </small>
      </div>

      <p class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </p>

      <p class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </p>

      <button
        class="reset-button"
        type="submit"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Resetting...' : 'Reset Password' }}
      </button>

    </form>

    <button
      class="back-button"
      type="button"
      (click)="backToLogin()"
    >
      ← Back to Login
    </button>

  </div>
</div>
